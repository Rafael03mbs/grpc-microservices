<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Distribution Center - Inventory</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Inventory <span>Recommendations</span></h1>
        </header>

        <div class="card add-item-card">
            <h2>New Item</h2>
            <form id="item-form">
                <div class="input-row">
                    <div class="input-group">
                        <label>Item ID</label>
                        <input type="text" id="itemId" placeholder="ITEM-001" required>
                    </div>
                    <div class="input-group">
                        <label>Warehouse ID</label>
                        <input type="text" id="warehouseId" value="WH-Main" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Historical Demand</label>
                    <input type="text" id="historicalDemand" placeholder="10, 15, 20, 18, 25" required>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Current Stock</label>
                        <input type="number" id="currentStock" value="50" min="0" required>
                    </div>
                    <div class="input-group">
                        <label>Reorder Level</label>
                        <input type="number" id="reorderLevel" value="10" min="0" required>
                    </div>
                    <div class="input-group">
                        <label>Forecast Horizon</label>
                        <input type="number" id="forecastHorizon" value="7" min="1" required>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Safety Stock</label>
                        <input type="number" id="safetyStock" value="0" min="0">
                    </div>
                    <div class="input-group">
                        <label>Supplier Lead Time</label>
                        <input type="number" id="supplierLeadTime" value="0" min="0">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Add Item</button>
            </form>
        </div>

        <div class="card batch-card">
            <h2>Batch</h2>
            <div id="batch-list" class="batch-list"></div>
            <button id="orchestrate-btn" class="btn-secondary" disabled>Run Recommendation</button>
        </div>

        <div class="card results-card" id="results-card" style="display: none;">
            <h2>Results</h2>
            <div id="results-list" class="results-list"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
